<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanban Board</title>
<style>
  :root {
    --bg: #f4f5f7;
    --col-bg: #ffffff;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #8a93a0;
    --todo: #6366f1;
    --inprogress: #f59e0b;
    --done: #10b981;
    --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .board { display: flex; gap: 16px; height: calc(100vh - 120px); }
  .column {
    flex: 1;
    background: var(--col-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    min-width: 240px;
    max-width: 360px;
    display: flex;
    flex-direction: column;
  }
  .column header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .column h2 { margin: 0; font-size: 15px; }
  .count { background: var(--border); color: var(--muted); border-radius: 999px;
           padding: 1px 9px; font-size: 12px; font-weight: 600; }
  .cards { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    cursor: grab;
    user-select: none;
  }
  .card:hover { box-shadow: 0 4px 10px rgba(16,24,40,.12); border-left-color: var(--todo); }
  .card:active { cursor: grabbing; }
  .card .title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .card .meta { font-size: 11px; color: var(--muted); }
  .card .badge {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .5px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
  }
  .card.todo { border-left-color: var(--todo); }
  .card.todo .badge { background: var(--todo); color: #fff; }
  .card.inprogress { border-left-color: var(--inprogress); }
  .card.inprogress .badge { background: var(--inprogress); color: #fff; }
  .card.done { border-left-color: var(--done); }
  .card.done .badge { background: var(--done); color: #fff; }
  .add-form { display: flex; gap: 8px; margin-top: 12px; }
  .add-form input {
    flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: inherit;
  }
  .add-form button {
    padding: 9px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--todo); color: #fff; }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1f2430; color: #fff;
          padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) { .board { flex-direction: column; } .board.height { height: auto; } }
</style>
</head>
<body>
  <h1>📋 Kanban Board</h1>
  <p class="sub">Desde tu tarea de Kanban de Hermes. Las tarjetas se pueden arrastrar entre columnas y se guardan automáticamente en el navegador.</p>

  <div class="board">
    <div class="column" id="col-todo">
      <header><h2>📋 Por hacer</h2><span class="count" id="c-todo"></span></header>
      <div class="cards" id="cards-todo"></div>
      <form class="add-form" data-status="todo">
        <input name="title" placeholder="Nueva tarea…" required />
        <button class="btn-primary" type="submit">Agregar</button>
      </form>
    </div>
    <div class="column" id="col-inprogress">
      <header><h2>🔄 En progreso</h2><span class="count" id="c-inprogress"></span></header>
      <div class="cards" id="cards-inprogress"></div>
      <form class="add-form" data-status="inprogress">
        <input name="title" placeholder="Nueva tarea…" required />
        <button class="btn-primary" type="submit">Agregar</button>
      </form>
    </div>
    <div class="column" id="col-done">
      <header><h2>✅ Hecho</h2><span class="count" id="c-done"></span></header>
      <div class="cards" id="cards-done"></div>
      <form class="add-form" data-status="done">
        <input name="title" placeholder="Nueva tarea…" required />
        <button class="btn-primary" type="submit">Agregar</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = "kanban-board-tasks";
  const COLORS = { todo: "#6366f1", inprogress: "#f59e0b", done: "#10b981" };
  const STATUSES = ["todo", "inprogress", "done"];

  const SEED = [
    { id: "t_b28e10bc", title: "Que cocino",           status: "done" },
    { id: "t_4c6f296e", title: "Que te gustaria comer?", status: "done" },
    { id: "t_2471d132", title: "Capture today's craving, constraints, and cook-or-not", status: "done" },
    { id: "t_6c41119b", title: "Model fridge, freezer, and pantry inventory capture", status: "done" },
    { id: "t_7a913173", title: "Propose recipes using craving plus what is at home", status: "done" },
    { id: "t_cecfeaee", title: "Build the shopping list from missing recipe ingredients", status: "done" },
    { id: "t_0ce030c1", title: "Find delivery options if today is not a cooking day", status: "done" }
  ];

  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  if (tasks.length === 0) tasks = SEED.map(t => ({ ...t }));

  const $ = s => document.querySelector(s);
  const cards = { todo: $("cards-todo"), inprogress: $("cards-inprogress"), done: $("cards-done") };

  function render() {
    STATUSES.forEach(s => {
      const el = cards[s];
      el.innerHTML = "";
      const list = tasks.filter(t => t.status === s);
      const count = document.getElementById("c-" + s);
      count.textContent = list.length;
      if (!list.length) {
        const d = document.createElement("div"); d.className = "empty"; d.textContent = "Sin tareas";
        el.appendChild(d);
      }
      list.forEach(t => {
        const card = document.createElement("div");
        card.className = "card " + s;
        card.draggable = true;
        card.innerHTML = `<div class="title">${escapeHtml(t.title)} <span class="badge">${s}</span></div>
                          <div class="meta">ID: ${t.id}</div>`;
        card.addEventListener("dragstart", e => { card._drag = t.id; e.dataTransfer.effectAllowed = "move"; });
        card.addEventListener("dragend", () => { card._drag = null; });
        el.appendChild(card);
      });
      el.querySelectorAll("[draggable]").forEach(el2 => {
        el2.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
        el2.addEventListener("drop", e => {
          e.preventDefault();
          const src = cards[t._drag];
          if (src === el) return;
          const task = tasks.find(t => t.id === _dragId());
          if (!task) return;
          task.status = s;
          save(); render(); toast("Movido a " + s);
        });
      });
    });
    save();
  }

  function _dragId() { return cards.done.querySelector("[draggable]") ? null : null; }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1400);
  }

  document.querySelectorAll(".add-form").forEach(form => {
    form.addEventListener("submit", e => {
      e.preventDefault();
      const title = form.querySelector("input").value.trim();
      if (!title) return;
      const status = form.dataset.status;
      tasks.push({ id: "t_" + Date.now().toString(36), title, status });
      form.querySelector("input").value = "";
      render(); toast("Agregada: " + title);
    });
  });

  render();
</script>
</body>
</html>
