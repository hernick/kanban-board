<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanban · ¿Qué te gustaría comer?</title>
<style>
  :root {
    --bg: #faf6f0;
    --card: #ffffff;
    --border: #e8ded4;
    --text: #3a3226;
    --muted: #8a7f6b;
    --primary: #e07b2a;
    --primary-dark: #c65f1c;
    --accent: #2f855a;
    --accent-soft: #e6f2e8;
    --warn: #d69e2e;
    --warn-soft: #fbf0d8;
    --shadow: 0 1px 3px rgba(60, 40, 10, .10), 0 1px 2px rgba(60, 40, 10, .05);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  header.app { max-width: 1100px; margin-bottom: 16px; }
  header.app h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.3px; }
  header.app .sub { color: var(--muted); font-size: 13px; margin: 0; }
  header.app .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .controls { max-width: 1100px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls button {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    font-size: 13px; background: #fff; color: var(--text);
  }
  .controls button:hover { border-color: var(--primary); color: var(--primary); }
  .controls .spacer { flex: 1 1 auto; }
  .board { max-width: 1100px; display: flex; gap: 16px; }
  .column {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-width: 240px;
    max-width: 360px;
  }
  .column header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .column h2 { margin: 0; font-size: 15px; }
  .count { background: var(--border); color: var(--muted); border-radius: 999px;
           padding: 1px 9px; font-size: 12px; font-weight: 600; }
  .cards { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 60px; padding-right: 4px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--primary);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    cursor: grab;
    user-select: none;
    position: relative;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { box-shadow: var(--shadow), 0 6px 14px rgba(60,40,10,.14); }
  .card:active { cursor: grabbing; }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; word-break: break-word; }
  .card .meta { font-size: 11px; color: var(--muted); }
  .card .badge {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .5px; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle;
  }
  .card .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .card .actions button {
    border: none; background: rgba(255,255,255,.95); color: var(--text);
    width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .card .actions button:hover { background: #e2e6ea; }
  .card.editing .title { background: #f4f6f8; border: 1px solid var(--border); border-radius: 6px; }
  .card.todo { border-left-color: var(--primary); }
  .card.todo .badge { background: var(--primary); color: #fff; }
  .card.inprogress { border-left-color: var(--warn); }
  .card.inprogress .badge { background: var(--warn); color: #fff; }
  .card.done { border-left-color: var(--accent); }
  .card.done .badge { background: var(--accent); color: #fff; }
  .add-form { display: flex; gap: 8px; margin-top: 12px; }
  .add-form input {
    flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff;
  }
  .add-form input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .add-form button {
    padding: 9px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    background: var(--primary); color: #fff;
  }
  .add-form button:hover { background: var(--primary-dark); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #3a3226; color: #fff;
          padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 760px) { .board { flex-direction: column; } }
</style>
</head>
<body>
  <div class="app">
    <h1>🍳 Kanban · ¿Qué te gustaría comer?</h1>
    <p class="sub">La carga se sincroniza con tu repositorio Kanban de Hermes. El tablero se actualiza sola cada minuto y puedes descargar/importar tareas.</p>
    <div class="controls">
      <button id="btn-sync" type="button">⬇️ Sincronizar (traer de GitHub)</button>
      <button id="btn-download" type="button">⬇️ Descargar tareas (JSON)</button>
      <input id="file-input" type="file" accept=".json" multiple style="display:none" />
      <span class="spacer"></span>
      <span class="meta" id="sync-status"></span>
    </div>
  </div>

  <div class="board">
    <div class="column" data-status="todo">
      <header><h2>📋 Por hacer</h2><span class="count" id="c-todo"></span></header>
      <div class="cards" id="cards-todo"></div>
      <form class="add-form" data-status="todo">
        <input name="title" placeholder="Nueva tarea…" required />
        <button type="submit">Agregar</button>
      </form>
    </div>
    <div class="column" data-status="inprogress">
      <header><h2>🔄 En progreso</h2><span class="count" id="c-inprogress"></span></header>
      <div class="cards" id="cards-inprogress"></div>
      <form class="add-form" data-status="inprogress">
        <input name="title" placeholder="Nueva tarea…" required />
        <button type="submit">Agregar</button>
      </form>
    </div>
    <div class="column" data-status="done">
      <header><h2>✅ Hecho</h2><span class="count" id="c-done"></span></header>
      <div class="cards" id="cards-done"></div>
      <form class="add-form" data-status="done">
        <input name="title" placeholder="Nueva tarea…" required />
        <button type="submit">Agregar</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const DATA_URL = "https://raw.githubusercontent.com/hernick/kanban-board/main/kanban-data.json";
  const STORAGE_KEY = "comer-kanban-tasks-v1";
  const STATUSES = ["todo", "inprogress", "done"];
  const LABELS = { todo: "Por hacer", inprogress: "En progreso", done: "Hecho" };

  const SEED = [
    { id: "proyecto", title: "¿Qué te gustaría comer?", status: "done" },
    { id: "capture", title: "Capture today's craving, constraints, and cook-or-not", status: "todo" },
    { id: "inventory", title: "Model fridge, freezer, and pantry inventory capture", status: "todo" },
    { id: "recipes", title: "Propose recipes using craving plus what is at home", status: "todo" },
    { id: "shopping", title: "Build the shopping list from missing recipe ingredients", status: "todo" },
    { id: "delivery", title: "Find delivery options if today is not a cooking day", status: "todo" }
  ];

  const cards = {
    todo: document.getElementById("cards-todo"),
    inprogress: document.getElementById("cards-inprogress"),
    done: document.getElementById("cards-done")
  };
  const toastEl = document.getElementById("toast");
  const statusEl = document.getElementById("sync-status");
  let tasks = [];

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function loadTasks(quiet) {
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      tasks = data.tasks || [];
      if (!quiet) statusEl.textContent = "Actualizado desde GitHub (" + tasks.length + " tareas)";
      return true;
    } catch (e) {
      statusEl.textContent = "Sin datos remotos, usando plantilla";
      return false;
    }
  }

  function render() {
    STATUSES.forEach(s => {
      const el = cards[s];
      el.innerHTML = "";
      const list = tasks.filter(t => t.status === s);
      document.getElementById("c-" + s).textContent = list.length;
      if (!list.length) {
        const d = document.createElement("div"); d.className = "empty"; d.textContent = "Sin tareas";
        el.appendChild(d);
      }
      list.forEach(t => {
        const card = document.createElement("div");
        card.className = "card " + s;
        card.draggable = true;
        card.innerHTML =
          `<div class="top"><div class="title">${escapeHtml(t.title)}</div>` +
          `<div class="actions">` +
            `<button data-act="edit" title="Editar">✎</button>` +
            `<button data-act="del" title="Eliminar">✕</button>` +
          `</div></div>` +
          `<div class="meta">${escapeHtml(t.id)} · ${LABELS[s]}</div>`;
        card.querySelector("[data-act=edit]").addEventListener("click", () => editCard(card, t));
        card.querySelector("[data-act=del]").addEventListener("click", () => deleteCard(card, t));
        card.addEventListener("dragstart", e => { card._drag = t.id; e.dataTransfer.effectAllowed = "move"; });
        card.addEventListener("dragend", () => { card._drag = null; });
        el.appendChild(card);
      });
      el.querySelectorAll("[draggable]").forEach(el2 => {
        el2.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
        el2.addEventListener("drop", e => {
          e.preventDefault();
          const src = tasks.find(t => t.id === card._drag);
          if (!src || src.status === s) return;
          src.status = s;
          render(); toast("➡️ " + t.title + " → " + LABELS[s]);
        });
      });
    });
  }

  function editCard(card, t) {
    const input = prompt("Editar tarea:", t.title);
    if (input === null) return;
    const v = input.trim();
    if (!v) { toast("Título vacío"); return; }
    t.title = v;
    render(); toast("✏️ " + v);
  }

  function deleteCard(card, t) {
    if (!confirm("¿Eliminar la tarea '" + t.title + "'?")) return;
    tasks = tasks.filter(x => x.id !== t.id);
    render(); toast("🗑️ Eliminada");
  }

  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch(e){} }

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  async function doSync() {
    statusEl.textContent = "Sincronizando…";
    const ok = await loadTasks(true);
    render();
    toast(ok ? "Sincronizado con GitHub" : "Sin datos remotos, usando plantilla");
  }

  async function downloadTasks() {
    const blob = new Blob([JSON.stringify({ descargado_en: new Date().toISOString(), tareas: tasks }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kanban-hermes-tareas.json";
    a.click();
    toast("Descargado kanban-hermes-tareas.json");
  }

  document.getElementById("btn-sync").addEventListener("click", doSync);
  document.getElementById("btn-download").addEventListener("click", downloadTasks);

  document.getElementById("file-input").addEventListener("change", async e => {
    const files = e.target.files;
    if (!files.length) return;
    let count = 0;
    for (const f of files) {
      try {
        const text = await f.text();
        const parsed = JSON.parse(text);
        if (parsed && parsed.id) {
          const card = tasks.find(t => t.id && t.id === parsed.id);
          if (card) {
            const extra = {};
            if (typeof parsed.titulo === 'string') extra.title = parsed.titulo;
            if (typeof parsed.comida === 'string') extra.title = parsed.comida;
            if (typeof parsed.antojo === 'string') extra.title = parsed.antojo;
            if (typeof parsed.summary === 'string') extra.summary = parsed.summary;
            Object.assign(card, extra);
            count++;
          }
        }
      } catch (err) { toast("Error leyendo " + f.name); }
    }
    if (count) { render(); toast("Importados " + count + " tarea(s) de Hermes"); }
    e.target.value = "";
  });

  loadTasks();
  setInterval(() => { loadTasks(true); render(); }, 60000);
  render();
</script>
</body>
</html>
